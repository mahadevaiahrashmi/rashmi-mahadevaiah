<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Accountability</title>
  <link rel="stylesheet" href="{{ root_path }}/static/style.css?v=5" />
</head>
<body>
{% if unlocked %}
  <main class="page">
    {% include "content.html" %}
  </main>
{% else %}
  <div id="lock" class="lock-wrap">
    <form id="lock-form" class="lock-card" method="post" action="{{ root_path }}/unlock" autocomplete="off">
      <div class="lock-icon">🔒</div>
      <h1>Accountability</h1>
      <p class="lock-sub">Enter the passkey to view this page.</p>
      <input id="passcode" name="passcode" type="password" placeholder="Passkey" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" autofocus />
      <button type="submit" class="unlock-btn">Unlock</button>
      {% if error %}<div class="lock-err">{{ error }}</div>{% endif %}
    </form>
  </div>
{% endif %}
</body>
</html>
