<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Accountability</title>
  <link rel="stylesheet" href="{{ root_path }}/static/style.css" />
</head>
<body>
  <!-- Passkey gate -->
  <div id="lock" class="lock-wrap">
    <form id="lock-form" class="lock-card" autocomplete="off">
      <div class="lock-icon">🔒</div>
      <h1>Accountability</h1>
      <p class="lock-sub">Enter the passkey to view this page.</p>
      <input id="passcode" type="password" placeholder="Passkey" autocomplete="off" autofocus />
      <button type="submit" class="unlock-btn">Unlock</button>
      <div id="err" class="lock-err"></div>
    </form>
  </div>

  <!-- The (empty) page, revealed after a correct passkey -->
  <main id="page" class="page" hidden>
    <header class="page-top">
      <h1>Accountability</h1>
    </header>
    <!-- intentionally empty -->
  </main>

  <script>window.APP_ROOT = {{ root_path | tojson }};</script>
  <script src="{{ root_path }}/static/app.js"></script>
</body>
</html>
